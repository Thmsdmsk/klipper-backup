#  Note: RGB and RGBW are different and must be defined explicitly.  
#        RGB and RGBW are also not able to be mix-and-matched in the same chain.
#        A separate data line would be needed for proper functioning.
#
#        RGBW LEDs will have a visible yellow-ish phosphor section to the chip.  
#        If your LEDs do not have this yellow portion, you have RGB LEDs.
#
#  
#  Note: We set RED and BLUE to 1.0 to make it easier for users and supporters to detect 
#        misconfigurations or miswiring. The default color format is for Neopixels with a dedicated 
#        white LED. On startup, all three SB LEDs should light up.
#
#        If you get random colors across your LEDs, change the color_order to GRB and restart. 
#        Then omit the W for each suggested color_order in the next paragraph.
#
#        If you get MAGENTA, your  color order is correct. If you get CYAN, you need to use RGBW. 
#        If you get YELLOW, you need to use BRGW (note that BRG is only supported in the latest Klipper version).
#
#        Once you have confirmed that the LEDs are set up correctly, you must now decide where you want 
#        these macros called up...which means adding them to your existing gcode macros.  
#        NOTHING will happen unless you add the neopixel_????? macros to your existing gcode macros.  


[neopixel leds]
pin: EBBCan: PD3
#  The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#  The number of Neopixel chips that are "daisy chained" to the provided pin. 
#  The default is 1 (which indicates only a single Neopixel is connected to the pin).
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB, RGB, GRBW, or RGBW. The default is GRB.
initial_RED:	0.0
initial_GREEN:	0.0
initial_BLUE:	0.0
initial_WHITE:	0.0
#  Sets the initial LED color of the Neopixel.
#  Each value should be between 0.0 and 1.0.
#  The WHITE option is only available on RGBW LEDs. 
#  The default for each color is 0.


[delayed_gcode neopixel_startup]
initial_duration: 1
gcode:
#  Logo (Index 1) auf Rot setzen
    SET_LED LED=leds RED=0.0 GREEN=0.0 BLUE=0.0 WHITE=0.2 INDEX=1 TRANSMIT=0
    
#  Nozzle (Index 2 & 3) auf Weiß setzen
    SET_LED LED=leds RED=1.0 GREEN=1.0 BLUE=1.0 WHITE=1.0 INDEX=2 TRANSMIT=0
    SET_LED LED=leds RED=1.0 GREEN=1.0 BLUE=1.0 WHITE=1.0 INDEX=3 TRANSMIT=1


[gcode_macro _vars]
#  User settings for the StealthBurner neopixel leds. 
#  You can change the neopixel colors and led configurations for the logo and nozzle here.
variable_colors: {
        'logo': { # Colors for logo states
            'WHITE':	{'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 1.0},
            'RED':		{'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'GREEN':	{'r': 0.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'BLUE':		{'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},
            'YELLOW':	{'r': 1.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'OFF':		{'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
        },
        'nozzle': { # Colors for nozzle states
            'WHITE':	{'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 1.0},
            'RED':		{'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'GREEN':	{'r': 0.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'BLUE':		{'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},
            'YELLOW':	{'r': 1.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'OFF':		{'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
        }
    }
variable_logo_led_name:         "leds" 
#  The name of the addressable LED chain that contains the logo LED(s).
variable_logo_idx:              "1" 
#  A comma-separated list of indexes LEDs in the logo.
variable_nozzle_led_name:       "leds"
#  The name of the addressable LED chain that contains the nozzle LED(s). 
#  This will typically be the same LED chain as the logo.
variable_nozzle_idx:            "2,3"
#  A comma-separated list of indexes of LEDs in the nozzle
gcode:
#  This section is required.  Do Not Delete.


[gcode_macro neopixel]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1) %}

    {% for led_index in idx %}
        {% set transmit=transmit_last if loop.last else 0 %}
        set_led led={led} red={red} green={green} blue={blue} white={white} index={led_index} transmit={transmit}
    {% endfor %}


[gcode_macro neopixel_color]
gcode:
    {% set leds_name = params.LEDS %}
    {% set color_name = params.COLOR %}
    {% set color = printer["gcode_macro _vars"].colors[leds_name][color_name] %}
    {% set led = printer["gcode_macro _vars"][leds_name + "_led_name"] %}
    {% set idx = printer["gcode_macro _vars"][leds_name + "_idx"] %}
    {% set transmit = params.TRANSMIT|default(1) %}

    neopixel led={led} red={color.r} green={color.g} blue={color.b} white={color.w} idx="{idx}" transmit={transmit}


[gcode_macro neopixel_logo]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _vars"].logo_led_name %}
    {% set idx = printer["gcode_macro _vars"].logo_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    neopixel led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}


[gcode_macro neopixel_nozzle]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _vars"].nozzle_led_name %}
    {% set idx = printer["gcode_macro _vars"].nozzle_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    neopixel led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}


[gcode_macro neopixel_logo_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    neopixel_logo red=0 blue=0 green=0 white=0 transmit={transmit}


[gcode_macro neopixel_nozzle_on]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    neopixel_color leds="nozzle" color="WHITE" transmit={transmit}


[gcode_macro neopixel_nozzle_off]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    neopixel_color leds="nozzle" color="OFF" transmit={transmit}


[gcode_macro neopixel_off]
gcode:
    neopixel_logo_off transmit=0
    neopixel_nozzle_off


[gcode_macro neopixel_white]
gcode:
    neopixel_color leds="logo" color="WHITE" transmit=0
    neopixel_color leds="nozzle" color="WHITE" transmit=1


[gcode_macro neopixel_red]
gcode:
    neopixel_color leds="logo" color="RED" transmit=0
    neopixel_color leds="nozzle" color="RED" transmit=1


[gcode_macro neopixel_green]
gcode:
    neopixel_color leds="logo" color="GREEN" transmit=0
    neopixel_color leds="nozzle" color="GREEN" transmit=1


[gcode_macro neopixel_blue]
gcode:
    neopixel_color leds="logo" color="BLUE" transmit=0
    neopixel_color leds="nozzle" color="BLUE" transmit=1


[gcode_macro neopixel_yellow]
gcode:
    neopixel_color leds="logo" color="YELLOW" transmit=0
    neopixel_color leds="nozzle" color="YELLOW" transmit=1
    