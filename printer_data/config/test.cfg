
#####################################################################
##  Print_Start Macro  ##############################################
#####################################################################

[gcode_macro PRINT_START]
gcode:
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    BED_MESH_CLEAR
    G28
    G90
    
    {% if not printer.motors_sync.applied %}
    SYNC_MOTORS
    {% endif %}
    
    G1 X{x_wait} Y{y_wait} Z50 F9000
    
    M140 S{target_bed}
    M104 S150

	{% if target_bed > 90 %}
		{% if target_bed >= 100 %}
        	M190 S100
        {% endif %}
        SET_FAN_SPEED FAN=Nevermore SPEED=1
        M190 S{target_bed}
        M109 S150
        M106 S255
        M117 Heatsoak: 40°C Chamber...
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM=40
        M107
        SET_FAN_SPEED FAN=Nevermore SPEED=0
    {% else %}
    	M190 S{target_bed}
        M109 S150
        M117 Heatsoak: 5 Min.
        G4 P300000
    {% endif %}
    M117 Heatsoak complete.
    
    QUAD_GANTRY_LEVEL
    G28 Z METHOD=CONTACT CALIBRATE=1
    BED_MESH_CALIBRATE ADAPTIVE=1
    
    G0 X{x_wait - 60} Y4 Z15 F9000
    M109 S{target_extruder}
    
    SET_FAN_SPEED FAN=Nevermore SPEED=1
    SET_FAN_SPEED FAN=Exhaust SPEED=1
    
    G0 X{x_wait - 50} Y4 Z0.4 F10000
    M83
    G1 X{x_wait + 50} E20 F1000            
    G1 E-0.5 F2100
    G90
    M82