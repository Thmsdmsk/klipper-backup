#####################################################################
##  Home X  #########################################################
#####################################################################

[gcode_macro _HOME_X]
gcode:
    STATUS_HEATING
    
    {% set RUN_CURRENT_X  = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_X1 = printer.configfile.settings['tmc2209 stepper_x1'].run_current|float %}
    {% set RUN_CURRENT_Y  = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set RUN_CURRENT_Y1 = printer.configfile.settings['tmc2209 stepper_y1'].run_current|float %}
    
    {% set HOME_CURRENT = 0.49 %}
    
    SET_TMC_CURRENT STEPPER=stepper_x  CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y  CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={HOME_CURRENT}
    
    SET_KINEMATIC_POSITION X=0 SET_HOMED=X
    M400
    G28 X

    STATUS_HOMING
    
    G91
    G1 X-5 F1200
    
    SET_TMC_CURRENT STEPPER=stepper_x  CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={RUN_CURRENT_X1}
    SET_TMC_CURRENT STEPPER=stepper_y  CURRENT={RUN_CURRENT_Y}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={RUN_CURRENT_Y1}

    STATUS_READY


#####################################################################
###  Home Y  ########################################################
