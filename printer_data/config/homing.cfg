[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # Sicheres Anheben der Z-Achse im relativen Modus
  G91
  SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
  G1 Z5 F1200

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}
  
  {% if home_all or 'Z' in params %}
    G90
    G1 X150 Y150 F15000  # Bettmitte anpassen (z. B. X175 Y175 bei 350mm)
    G28 Z
    G1 Z10 F1500
  {% endif %}

[gcode_macro _CG28]
description: Homing nur ausführen, wenn Achsen nicht gehomet sind
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}