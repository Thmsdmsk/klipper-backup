logLevel: info              # Verbosity of the program; available values are "error", "warn", "info", "debug".
logDestinations: [stdout]   # Destinations of log messages; available values are "stdout", "file" and "syslog".
logStructured: false        # When destination is "stdout" or "file", emit logs in structured format (JSONL).
logFile: mediamtx.log       # When "file" is in logDestinations, this is the file which will receive logs.
sysLogPrefix: mediamtx      # When "syslog" is in logDestinations, use prefix for logs.
dumpPackets: false          # Dump packets to disk. This is useful for debugging.

readTimeout: 10s            # Timeout of read operations.
writeTimeout: 10s           # Timeout of write operations.
writeQueueSize: 512         # Size of the queue of outgoing packets. A higher value allows to increase throughput, a lower value allows to save RAM.
udpMaxPayloadSize: 1452     # Maximum size of outgoing UDP payloads. It defaults to the maximum packet size on ethernet (1500) minus IPv6 and UDP headers (48). 
                            # This can be decreased to avoid fragmentation on networks with a low MTU.
udpReadBufferSize: 0        # Size of the read buffer of every UDP socket. This can be increased to decrease packet losses. It defaults to the default value of the operating system.
runOnConnect:               # Command to run when a client connects to the server. This is terminated with SIGINT when a client disconnects from the server. The following environment variables are available:
                            # * MTX_CONN_TYPE: connection type
                            # * MTX_CONN_ID: connection ID
                            # * RTSP_PORT: RTSP server port
runOnConnectRestart: false  # Restart the command if it exits.
runOnDisconnect:            # Command to run when a client disconnects from the server. Environment variables are the same as runOnConnect.

authMethod: internal        # Authentication method. Available values:
                            # * Internal database: credentials are stored in the configuration file
                            # * External HTTP server: an external HTTP URL is contacted for each authentication request
                            # * External JWT provider: credentials are signed tokens released by an external identity server

webrtc: true                  # Enable the WebRTC server, which allows to publish and read streams with the WebRTC protocol.
webrtcAddress: :8889          # Address of the WebRTC TCP/HTTP listener.
webrtcEncryption: false       # Enable HTTPS.
                              # This covers only the WebRTC handshake, while WebRTC streams
                              # are always encrypted with a key that is exchanged during the WebRTC handshake.
webrtcServerKey: ""           # Path to the server key.
                              # This can be generated with:
                              # openssl genrsa -out server.key 2048
                              # openssl req -new -x509 -sha256 -key server.key -out server.crt -days 3650
webrtcServerCert: ""          # Path to the server certificate.
webrtcAllowOrigins: ["*"]     # Allowed CORS origins.
                              # Supports wildcards: ['http://*.example.com']
webrtcLocalTCPAddress: :8189  # Address of a TCP/ICE listener that will receive connections.
                              # This is disabled by default since TCP is less efficient than UDP and
                              # introduces a progressive delay when network is congested.
webrtcIPsFromInterfaces: true # WebRTC clients need to know the IP of the server.
                              # Gather IPs from interfaces and send them to clients.

paths:
  cam:
    source: rpiCamera
    sourceOnDemand: true

    rpiCameraCamID: 0           # ID of the camera
    rpiCameraSecondary: false   # Whether this is a secondary stream.
    rpiCameraWidth: 1920        # Width of frames.
    rpiCameraHeight: 1080       # Height of frames.
    rpiCameraHFlip: false       # Flip horizontally.
    rpiCameraVFlip: false       # Flip vertically.
    rpiCameraBrightness: 0      # Brightness [-1, 1].
    rpiCameraContrast: 1        # Contrast [0, 16].
    rpiCameraSaturation: 1      # Saturation [0, 16].
    rpiCameraSharpness: 5       # Sharpness [0, 16].
    rpiCameraExposure: normal   # Exposure mode. Values: normal, short, long, custom.
    rpiCameraAWB: auto          # Auto-white-balance mode. (auto, incandescent, tungsten, fluorescent, indoor, daylight, cloudy or custom).
    rpiCameraAWBGains: [0, 0]   # Auto-white-balance fixed gains. This can be used in place of rpiCameraAWB. Format: [red,blue].
    rpiCameraDenoise: "off"     # Denoise operating mode (off, cdn_off, cdn_fast, cdn_hq).
    rpiCameraShutter: 0         # Fixed shutter speed, in microseconds.
    rpiCameraMetering: centre   # Metering mode of the AEC/AGC algorithm (centre, spot, matrix or custom).
    rpiCameraGain:              # Fixed gain.
    rpiCameraEV: -2             # EV compensation of the image in range [-10, 10].
    rpiCameraROI:               # Region of interest, in format x,y,width,height (all normalized between 0 and 1).
    rpiCameraHDR: false          # Whether to enable HDR on Raspberry Camera 3.
    rpiCameraTuningFile:        # Tuning file.
    rpiCameraMode:              # Sensor mode, in format [width]:[height]:[bit-depth]:[packing] bit-depth and packing are optional.
    rpiCameraFPS: 30            # frames per second.
    rpiCameraAfMode: manual     # Autofocus mode (auto, manual or continuous).
    rpiCameraAfRange: normal    # Autofocus range (normal, macro or full).
    rpiCameraAfSpeed: normal    # Autofocus speed (normal or fast).
    rpiCameraLensPosition: 4.0  # Lens position (for manual autofocus only), will be set to focus to a specific distance calculated by the following formula: d = 1 / value. 
                                # Examples: 0 moves the lens to infinity. 0.5 moves the lens to focus on objects 2m away. 2 moves the lens to focus on objects 50cm away.
    rpiCameraAfWindow:          # Autofocus window, in the form x,y,width,height where the coordinates are given as a proportion of the entire image.
    rpiCameraFlickerPeriod: 0   # Manual flicker correction period, in microseconds.
    rpiCameraTextOverlayEnable: false                     # Enables printing text on each frame.
    rpiCameraTextOverlay: "%Y-%m-%d %H:%M:%S - MediaMTX"  # Text that is printed on each frame. format is the one of the strftime() function.
    rpiCameraCodec: auto                                  # Codec (auto, hardwareH264, softwareH264 or mjpeg). 
                                                          # When is "auto", it defaults to: 
                                                          # * hardwareH264 when stream is primary and hardware encoder is available 
                                                          # * softwareH264 when stream is primary and hardware encoder is not available 
                                                          # * mjpeg when stream is secondary
    rpiCameraIDRPeriod: 30      # Period between IDR frames (when codec is hardwareH264 or softwareH264).
    rpiCameraBitrate: 8000000   # Bitrate (when codec is hardwareH264 or softwareH264).
    rpiCameraH264Profile: high  # H264 profile (auto, baseline, main or high). When is "auto", it defaults to: * main when codec is hardwareH264 * baseline when codec is softwareH264
    rpiCameraH264Level: "4.1"   # H264 level (4.0, 4.1 or 4.2).
    rpiCameraMJPEGQuality: 60   # M-JPEG quality (0-100).
