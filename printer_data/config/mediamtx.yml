logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

readTimeout: 10s
writeTimeout: 10s

authMethod: internal

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcServerKey: "" 
webrtcServerCert: ""
webrtcAllowOrigins: ["*"]
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true

rpiCameraCamID: 0           # ID of the camera
rpiCameraSecondary: false   # Whether this is a secondary stream.
rpiCameraWidth: 1920        # Width of frames.
rpiCameraHeight: 1080       # Height of frames.
rpiCameraHFlip: false       # Flip horizontally.
rpiCameraVFlip: false       # Flip vertically.
rpiCameraBrightness: 0      # Brightness [-1, 1].
rpiCameraContrast: 1        # Contrast [0, 16].
rpiCameraSaturation: 1      # Saturation [0, 16].
rpiCameraSharpness: 1       # Sharpness [0, 16].
rpiCameraExposure: normal   # Exposure mode. Values: normal, short, long, custom.
rpiCameraAWB: auto          # Auto-white-balance mode. (auto, incandescent, tungsten, fluorescent, indoor, daylight, cloudy or custom).
rpiCameraAWBGains: [0, 0]   # Auto-white-balance fixed gains. This can be used in place of rpiCameraAWB. Format: [red,blue].
rpiCameraDenoise: "off"     # Denoise operating mode (off, cdn_off, cdn_fast, cdn_hq).
rpiCameraShutter: 0         # Fixed shutter speed, in microseconds.
rpiCameraMetering: centre   # Metering mode of the AEC/AGC algorithm (centre, spot, matrix or custom).
rpiCameraGain: 0            # Fixed gain.
rpiCameraEV: -2             # EV compensation of the image in range [-10, 10].
rpiCameraROI:               # Region of interest, in format x,y,width,height (all normalized between 0 and 1).
rpiCameraHDR: false         # Whether to enable HDR on Raspberry Camera 3.
rpiCameraTuningFile:        # Tuning file.
rpiCameraMode:              # Sensor mode, in format [width]:[height]:[bit-depth]:[packing] bit-depth and packing are optional.
rpiCameraFPS: 30            # frames per second.
rpiCameraAfMode: manual     # Autofocus mode (auto, manual or continuous).
rpiCameraAfRange: normal    # Autofocus range (normal, macro or full).
rpiCameraAfSpeed: normal    # Autofocus speed (normal or fast).
rpiCameraLensPosition: 4.0  # Lens position (for manual autofocus only), will be set to focus to a specific distance calculated by the following formula: d = 1 / value Examples: 0 moves the lens to infinity. 0.5 moves the lens to focus on objects 2m away. 2 moves the lens to focus on objects 50cm away.
rpiCameraAfWindow:          # Autofocus window, in the form x,y,width,height where the coordinates are given as a proportion of the entire image.
rpiCameraFlickerPeriod: 0   # Manual flicker correction period, in microseconds.
rpiCameraTextOverlayEnable: false                     # Enables printing text on each frame.
rpiCameraTextOverlay: "%Y-%m-%d %H:%M:%S - MediaMTX"  # Text that is printed on each frame. format is the one of the strftime() function.
rpiCameraCodec: auto                                  # Codec (auto, hardwareH264, softwareH264 or mjpeg). When is "auto", it defaults to: * hardwareH264 when stream is primary and hardware encoder is available * softwareH264 when stream is primary and hardware encoder is not available * mjpeg when stream is secondary
rpiCameraIDRPeriod: 30      # Period between IDR frames (when codec is hardwareH264 or softwareH264).
rpiCameraBitrate: 8000000   # Bitrate (when codec is hardwareH264 or softwareH264).
rpiCameraH264Profile: high  # H264 profile (auto, baseline, main or high). When is "auto", it defaults to: * main when codec is hardwareH264 * baseline when codec is softwareH264
rpiCameraH264Level: "4.1"   # H264 level (4.0, 4.1 or 4.2).
rpiCameraMJPEGQuality: 60   # M-JPEG quality (0-100).

paths:
  cam:
    source: rpiCamera
    sourceOnDemand: true
