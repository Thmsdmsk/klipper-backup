[gcode_macro _LOWER_CURRENT_AWD]
description: Lowers the current of all 4 XY motors for sensorless homing.
gcode:
    # 1. Clear buffer so the printhead is fully stopped when switching
    M400  
    
    # 2. Set homing current to 0.49A.
    SET_TMC_CURRENT STEPPER=stepper_x  CURRENT=0.49
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT=0.49
    SET_TMC_CURRENT STEPPER=stepper_y  CURRENT=0.49
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT=0.49
    
    # 3. Give drivers half a second to stabilize StallGuard registers.
    G4 P500  


[gcode_macro _RESTORE_CURRENT_AWD]
description: Restores normal motor current for all 4 XY motors.
gcode:
    # 1. Read normal values directly from the config.
    {% set RUN_CURRENT_X  = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_X1 = printer.configfile.settings['tmc2209 stepper_x1'].run_current|float %}
    {% set RUN_CURRENT_Y  = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set RUN_CURRENT_Y1 = printer.configfile.settings['tmc2209 stepper_y1'].run_current|float %}

    # 2. Clear buffer
    M400
    
    # 3. Restore original currents.
    SET_TMC_CURRENT STEPPER=stepper_x  CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={RUN_CURRENT_X1}
    SET_TMC_CURRENT STEPPER=stepper_y  CURRENT={RUN_CURRENT_Y}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={RUN_CURRENT_Y1}
    
    # 4. Give drivers half a second to stabilize StallGuard registers.
    G4 P500