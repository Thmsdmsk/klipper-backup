[homing_override]
axes: xyz
set_position_z: 0
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set x_homed = 'x' in printer.toolhead.homed_axes %}
  {% set y_homed = 'y' in printer.toolhead.homed_axes %}

  # Abort if Z homing requested without X and Y homed
  {% if 'Z' in params and not home_all and (not x_homed or not y_homed) %}
    M84  # Resets all homing flags (removes fake Z-homed status)
    {action_raise_error("Must home X and Y first before homing Z!")}
  {% else %}

    # 1. Lift Z by 5mm synchronously
    G91
    G1 Z5 F1200

    # 2. Home Y if requested, if home_all, or if Y is NOT yet homed
    {% if home_all or 'Y' in params or not y_homed %}
      _HOME_Y
    {% endif %}

    # 3. Home X if requested or if home_all
    {% if home_all or 'X' in params %}
      _HOME_X
    {% endif %}

    # 4. Home Z if requested or if home_all
    {% if home_all or 'Z' in params %}
      G90
      G1 X150 Y150 F15000  # Bed center
      G28 Z
      G1 Z10 F1500
    {% endif %}

  {% endif %}


[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}