[gcode_macro LOWER_STEPPER_CURRENT_AWD]
description: Lowers the current of all 4 XY motors for sensorless homing.
gcode:
    {% set HOME_CURRENT = 0.4 %}
    {% set steppers = ['stepper_x', 'stepper_x1', 'stepper_y', 'stepper_y1'] %}
    
    {% for stepper in steppers %}
        SET_TMC_CURRENT STEPPER={stepper} CURRENT={HOME_CURRENT}
    {% endfor %}


[gcode_macro RESTORE_STEPPER_CURRENT_AWD]
description: Restores run current for all 4 XY motors.
gcode:
    {% set steppers = ['stepper_x', 'stepper_x1', 'stepper_y', 'stepper_y1'] %}
    
    {% for stepper in steppers %}
        {% set run_current = printer.configfile.settings['tmc2209 ' ~ stepper].run_current|float %}
        SET_TMC_CURRENT STEPPER={stepper} CURRENT={run_current}
    {% endfor %}