[homing_override]
axes: xyz
gcode:
  # Prüfen, ob gar keine Achse angegeben wurde (also komplettes G28)
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # 1. Z-Hop für Sicherheit (Druckkopf leicht anheben)
  SET_KINEMATIC_POSITION Z=1 SET_HOMED=Z
  G91
  G1 Z5 F1200
  G90

  # 2. Y-HOMING
  # Wird ausgeführt bei: G28 (Home All), G28 Y ODER wenn G28 X aufgerufen wird!
  {% if home_all or 'Y' in params %}
    _HOME_Y
  {% endif %}

    # 2. Y-HOMING
  # Wird ausgeführt bei: G28 (Home All), G28 Y ODER wenn G28 X aufgerufen wird!
  #{% if home_all or 'Y' in params or 'X' in params %}
  #  _HOME_Y
  #{% endif %}
  
  # 3. X-HOMING
  # Wird ausgeführt bei: G28 ODER G28 X
  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}
  
  # 4. Z-HOMING (mit Beacon)
  # Wird ausgeführt bei: G28 ODER G28 Z
  {% if home_all or 'Z' in params %}
    # Schutzfunktion: Falls X/Y noch gar nicht gehomed sind, erst X/Y homen, 
    # damit die Fahrt zur Bettmitte (150, 150) nicht fehlschlägt!
    {% if "xy" not in printer.toolhead.homed_axes %}
      _HOME_Y
      _HOME_X
    {% endif %}

    G90
    G1 X150 Y150 F15000  ; Fahrt zur Bettmitte
    G28 Z                ; Beacon Z-Homing
    G1 Z10 F1500         ; Kopf nach dem Homing anheben
  {% endif %}



[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
