[gcode_macro _HOME_X]
gcode:
    # 1. Ströme aller 4 Motoren auslesen
    {% set RUN_X  = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_X1 = printer.configfile.settings['tmc2209 stepper_x1'].run_current|float %}
    {% set RUN_Y  = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set RUN_Y1 = printer.configfile.settings['tmc2209 stepper_y1'].run_current|float %}
    {% set HOME_CURRENT = 0.49 %}

    # 2. Strom bei ALLEN 4 Motoren absenken
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={HOME_CURRENT}

    # 3. Werkzeugkopf kurz freifahren
    SET_KINEMATIC_POSITION X=15 SET_HOMED=X
    G91
    G1 X-15 F1200
    M400 

    # 4. Sensorless Home X
    G28 X
    
    # 5. Vom Anschlag wegbewegen
    G91
    G1 X-15 F1200
    G4 P1000  ; Pause für StallGuard-Register

    # 6. Normalen Arbeitsstrom auf ALLEN 4 Motoren wiederherstellen
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_X}
    SET_TMC_CURRENT STEPPER=stepper_x1 CURRENT={RUN_X1}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_Y}
    SET_TMC_CURRENT STEPPER=stepper_y1 CURRENT={RUN_Y1}




