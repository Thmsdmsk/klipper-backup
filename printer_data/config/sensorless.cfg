#####################################################################
##   Homing override Macro   ########################################
#####################################################################

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set x_homed = 'x' in printer.toolhead.homed_axes %}
  {% set y_homed = 'y' in printer.toolhead.homed_axes %}

  # SICHERHEITS-CHECK: Bricht ab, wenn nur Z gehomet werden soll, aber X/Y noch fehlen
  {% if 'Z' in params and not home_all and (not x_homed or not y_homed) %}
    {action_raise_error("Sicherheitssperre: X und Y muessen zuerst gehomet werden!")}
  {% else %}

    # ZENTRALE HOMING-WERTE
    {% set OLD_ACCEL = printer.toolhead.max_accel %}
    {% set HOME_ACCEL = 1000 %}
    {% set XY_TRAVEL_SPEED = 6000 %}
    {% set Z_TRAVEL_SPEED = 1200 %}

    SET_VELOCITY_LIMIT ACCEL={HOME_ACCEL}

    # Z-Hop (wird erst ausgeführt, wenn der Sicherheits-Check bestanden wurde)
    SET_KINEMATIC_POSITION Z=1 SET_HOMED=Z
    G91
    G1 Z4 F{Z_TRAVEL_SPEED}

    {% if home_all or 'X' in params %}
      _HOME_X
    {% endif %}
    
    {% if home_all or 'Y' in params %}
      _HOME_Y
    {% endif %}
    
    {% if home_all or 'Z' in params %}
      STATUS_HEATING
      G90
      G1 X150 Y150 F{XY_TRAVEL_SPEED}

      G28 Z
      STATUS_HOMING
      G1 Z10 F{Z_TRAVEL_SPEED}
      STATUS_READY
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL={OLD_ACCEL}

  {% endif %}


#####################################################################
##   CG28 Macro   ###################################################
#####################################################################

[gcode_macro _CG28]
description: Homing only if necessary
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


#####################################################################
##   QUAD_GANTRY_LEVEL Macro   ######################################
#####################################################################

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    _CG28

    STATUS_LEVELING
    {% set OLD_ACCEL = printer.toolhead.max_accel %}
    {% set HOME_ACCEL = 1000 %}
    
    # Gleiche Beschleunigung wie beim Homing anwenden
    SET_VELOCITY_LIMIT ACCEL={HOME_ACCEL}

    _QUAD_GANTRY_LEVEL {rawparams}

    G28 Z

    SET_VELOCITY_LIMIT ACCEL={OLD_ACCEL}
    STATUS_READY