[include macro.cfg]
[include mainsail.cfg]
[include neopixel.cfg]
[include shaketune.cfg]
[include auto_speed.cfg]
[include sensorless.cfg]


#####################################################################
# --- PRINTER -------------------------------------------------------
#####################################################################

[mcu]
serial: /dev/ttyAMA0 
baud: 1000000
restart_method: command

[mcu EBBCan]
canbus_uuid: ae4887ff43f3

[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 150
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 3600

[gcode_arcs]
resolution: 0.1

[exclude_object]

[skew_correction]


#####################################################################
# --- X/Y STEPPER SETTINGS ------------------------------------------
#####################################################################

# --- S1 (REAR RIGHT) -----------------

[stepper_y]
step_pin: PC14
dir_pin: !PC13
enable_pin: !PE6
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_y:virtual_endstop	
position_endstop: 300
position_min: 0
position_max: 300
homing_speed: 120
second_homing_speed: 10
homing_retract_dist: 0
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
stealthchop_threshold: 0
sense_resistor: 0.050
interpolate: false
diag1_pin: ^!PC15
run_current: 1.8
driver_HSTRT: 2
driver_HEND: 3
driver_TOFF: 3
driver_SGT: 1
#driver_TPFD: 0


# --- (S2 REAR LEFT) ------------------

[stepper_x]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 300
position_min: 0
position_max: 300
homing_speed: 120
second_homing_speed: 10
homing_retract_dist: 0
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
stealthchop_threshold: 0
sense_resistor: 0.050
interpolate: false
diag1_pin: ^!PF0
run_current: 1.8
driver_HSTRT: 2
driver_HEND: 3
driver_TOFF: 3
driver_SGT: 1
#driver_TPFD: 0


# --- S3 (FRONT LEFT) ----------------

[stepper_y1]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200

[tmc5160 stepper_y1]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
stealthchop_threshold: 0
sense_resistor: 0.050
interpolate: false
run_current: 1.8
driver_HSTRT: 2
driver_HEND: 3
driver_TOFF: 3
