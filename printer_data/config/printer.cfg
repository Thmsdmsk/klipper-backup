homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PD11
diag_pin: ^PG9
driver_SGTHRS: 51
interpolate: false
run_current: 1.2
sense_resistor: 0.05
stealthchop_threshold: 0

#[autotune_tmc stepper_x]
