
[include macro.cfg]
[include mainsail.cfg]
[include neopixel.cfg]
[include shaketune.cfg]
[include sensorless.cfg]


#####################################################################
# --- PRINTER -------------------------------------------------------
#####################################################################

[mcu]
serial: /dev/ttyAMA0 
baud: 1000000
restart_method: command

[mcu EBBCan]
canbus_uuid: ae4887ff43f3

[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 150
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 3600

[gcode_arcs]
resolution: 0.1

[exclude_object]


#####################################################################
# --- X/Y STEPPER SETTINGS ------------------------------------------
#####################################################################

# --- MOTOR0 RR(B) ------------------------

[stepper_y]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop	
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 60
second_homing_speed: 10
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC4
diag_pin: ^PG6
driver_SGTHRS: 51
interpolate: false
run_current: 1.2
sense_resistor: 0.05
stealthchop_threshold: 0

#[autotune_tmc stepper_y]
#motor: ldo-42sth48-2504ah
#tuning_goal: performance


# --- MOTOR1 RL(A) ------------------------

[stepper_x]
