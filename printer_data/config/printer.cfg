#####################################################################
##   Bed Heater   ###################################################
#####################################################################


##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3

##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2
max_power: 0.6
min_temp: 0
max_temp: 120


#####################################################################
##   Probe   ########################################################
#####################################################################


[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_422783785154354D38202020FF0A242F-if00

speed: 20                        #  Z probing dive speed.
lift_speed: 20                   #  Z probing lift speed.
backlash_comp: 0.00957           #  Backlash compensation distance for removing Z backlash before measuring the sensor response.
x_offset: 0                      #  X offset of beacon from the nozzle.
y_offset: 21.1                   #  Y offset of beacon from the nozzle.
trigger_distance: 2              #  Beacon trigger distance for homing.
trigger_dive_threshold: 1        #  Threshold for range vs dive mode probing. Beyond `trigger_distance + trigger_dive_threshold` a dive will be used.
trigger_hysteresis: 0.006        #  Hysteresis on trigger threshold for untriggering, as a percentage of the trigger threshold.
z_settling_time: 5               #  Delay (in ms) for the Z axis to settle before taking proximity measurements.
cal_nozzle_z: 0.1                #  Expected nozzle offset after completing manual Z offset calibration.
cal_floor: 0.2                   #  Minimum z bound on sensor response measurement.
cal_ceil: 5                      #  Maximum z bound on sensor response measurement.
cal_speed: 1                     #  Speed while measuring response curve.
cal_move_speed: 10               #  Speed while moving to position for response curve measurement.
default_model_name: default      #  Name of default beacon model to load.
mesh_main_direction: x           #  Primary travel direction during mesh measurement.
#mesh_overscan: -1               #  Distance to use for direction changes at mesh line ends. Omit this setting and a default will be calculated from line spacing and available travel.
mesh_cluster_size: 1             #  Radius of mesh grid point clusters.
mesh_runs: 1                     #  Number of passes to make during mesh scan.
zero_reference_cluster_size: 1   #  Radius of cluster used for zero reference position, this is the equivalent of mesh_cluster_size for the zero reference position.
accel_scale: 16g                 #  Adjust the sensitivity of the accelerometer during shaper measurement, valid settings on RevH are 16g, 8g, 4g and 2g.
accel_axes_map: -x, -y, z        #  Reassign or invert axes of the accelerometer to align with machine coordinates.

default_probe_method: proximity           #  Sets the default probing method for mesh, tilt, qgl, probe, etc.
contact_max_hotend_temperature: 180       #  increase to enable hot contacting Temperature limit for the hotend when contacting, override this for temps which may damage some surfaces.
contact_sensitivity: 0                    #  Adjusts noise tolerance of contact processing. Values 0-3 are valid, with 3 tolerating the most noise.
contact_latency_min: 0                    #  Limits how low of a latency contact is allowed to advance.

##  New additions for beacon safe_z_home functionality
#home_xy_position: 150, 150                #   X, Y coordinate for homing z via contact. 							#  Disabled for sensorless homing.
#home_z_hop: 5                             #   Distance to retract before x/y homing moves. 							#  Disabled for sensorless homing.
#home_z_hop_speed: 30                      #   Retraction speed for z hop. 											#  Disabled for sensorless homing.
#home_xy_move_speed: 350                   #   Speed for moving to home_xy_position. 								#  Disabled for sensorless homing.
#home_y_before_x: true                     #   If set, the Y axis will home first when using the beacon safe_z_home. #  Disabled for sensorless homing.

##  New additions for setting default homing mode
#home_method: contact|proximity              #  Sets default homing method used by G28. `proximity` requires a valid beacon model to be loaded.
#home_method_when_homed: contact|proximity   #  Defaults to `home_method` value. Sets the homing method when the machine is already in a homed state.
#home_autocalibrate: always|unhomed|never    #  Sets the autocalibration behavior. `always` will autocal on every home, `unhomed` on initial homing, 
                                             #  `never` will never so that models stored in config may be used with proximity homing.

#home_gcode_pre_x: _HOME_PRE_AXIS AXIS=X     #  Enables a gcode macro before homing the x axis
#home_gcode_post_x: _HOME_POST_AXIS AXIS=X   #  Enables a gcode macro after homing the x axis
#home_gcode_pre_y: _HOME_PRE_AXIS AXIS=Y     #  Enables a gcode macro before homing the y axis
#home_gcode_post_y: _HOME_POST_AXIS AXIS=Y   #  Enables a gcode macro after homing the x axis

#contact_activate_gcode: _CONTACT_ACTIVATE       #  Enables a gcode macro to be called before contact is activated
#contact_deactivate_gcode: _CONTACT_DEACTIVATE   #  Enables a gcode macro to be called after contact is deactivated

##  New autocalibration config options
autocal_speed: 3            #  Speed during contact movement. Probing outside of 2-5mm/s not recommended and at your own risk.
autocal_accel: 100          #  Acceleration of autocal movement.
autocal_retract_dist: 2     #  Retract distance between autocal samples.
autocal_retract_speed: 10   #  Speed of autocal retraction move.
autocal_sample_count: 3     #  Number of samples used for each autocal.
autocal_tolerance: 0.008    #  Acceptance tolerance for an autocal result.
autocal_max_retries: 3      #  Number of retry attempts permitted when tolerance is exceeded.


#####################################################################
##   Fan Control   ##################################################
#####################################################################


##  Controller fan - FAN5
[controller_fan Controller]
pin: PD12
cycle_time: 0.00004
hardware_pwm: true
kick_start_time: 0.1
heater: heater_bed
fan_speed: 0.08

##  TMC Driver fan - FAN4
[controller_fan TMC_Driver]
pin: PE5
cycle_time: 0.00004
hardware_pwm: true
kick_start_time: 0.1
stepper: stepper_x
fan_speed: 1.0

##  Nevermore fan - FAN3
[fan_generic Nevermore]
pin: PD13
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.00004
hardware_pwm: true
kick_start_time: 0.1
off_below: 0.0

##  Exhaust fan - FAN2
[fan_generic Exhaust]
pin: PD14
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.00004
hardware_pwm: true
kick_start_time: 0.1
off_below: 0.0


#####################################################################
##   Additional Sensors   ###########################################
#####################################################################


##  Chamber Temperature - T1
[temperature_sensor Chamber]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF5
min_temp: 0
max_temp: 100
gcode_id: chamber_th

##  Raspberry Pi 4 CPU Temperature
[temperature_sensor RPi4B]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

##  Octopus MCU Temperature
[temperature_sensor BTT_Octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

##  EBB36 Temperature
[temperature_sensor EBBCan]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100


#####################################################################
##   Homing and Quad Gantry Level   #################################
#####################################################################


#[safe_z_home]
#home_xy_position: 150,150   #  Sets the x, y position used for z homing with beacon.					#  Disabled for sensorless homing.
#speed: 400																								#  Disabled for sensorless homing.
#z_hop: 3                    #  Retracts the z axis before x, y homing to avoid dragging the nozzle.	#  Disabled for sensorless homing.

##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and (300,300) to respective belt positions.
[quad_gantry_level]
gantry_corners:
  -60, -10
  360, 370

##  Probe points
points:
  50,25
  50,225
  250,225
  250,25
speed: 300
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 40  #  Default: 20


#####################################################################
##   Bed Mesh Leveling   ############################################
#####################################################################


[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 30,30
mesh_max: 275,275
probe_count: 51,51                 #  Values should be odd, so one point is directly at bed center
zero_reference_position: 150,150   
adaptive_margin: 5                 #  Adaptive meshing
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.1

##  Requirement for adaptive bed mesh
[exclude_object]


#####################################################################
##   Displays   #####################################################
#####################################################################


##  KlipperScreen and Mainsail config
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[gcode_macro _REPORT_BEACON_MODEL]
description: Sendet das aktuelle Modell an das Interface
gcode:
    {% set model = printer.beacon.model_name %}
    {action_respond_info("Aktives Beacon-Modell: " ~ model)}

[pause_resume]


