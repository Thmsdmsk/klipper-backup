[include macro.cfg]
[include mainsail.cfg]
[include neopixel_led.cfg]
[include shaketune.cfg]
[include homing.cfg]


#####################################################################
##   Printer   #####################################################
#####################################################################


[mcu]
serial: /dev/ttyAMA0 
baud: 1000000
restart_method: command

[mcu EBBCan]
canbus_uuid: ae4887ff43f3

[printer]
kinematics: corexy
max_velocity: 1000  
max_accel: 5000
minimum_cruise_ratio: 0.5
max_z_velocity: 30            #  Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 3600

##  Enable arcs support
[gcode_arcs]
resolution: 0.1

[force_move]
enable_force_move: True


#####################################################################
##   X/Y Stepper Settings   #########################################
#####################################################################


[motors_sync]
axes: x,y
#    Axes on which synchronization will be performed, separated by commas.
#    For example, for CoreXY kinematics: x,y.
accel_chip: beacon
#    Accelerometer for vibrations collection: adxl345 / mpu9250 etc.
#encoder_chip_<axis>:
#    Axis name, assigned encoder name, for measuring motor deviations.
#microsteps: 16
#    Maximum microsteps resolution relative to motor full step.
#steps_model: linear, 10000, 0
#    Mathematical model and its coefficients describing the dependence of
#    motor microstep displacement on the magnitude of the measured impulse.
#    The model determines how many microsteps the motor position is corrected
#    per one correction step depending on the measured impulse magnitude.  
#max_step_size: 3
#    Maximum number of microsteps the motor can move in one correction step
#    to achieve the planned impulse magnitude.
#axes_steps_diff:
#    Difference in motor positions in microsteps between two linked axes,
#    to start checking the position offset of the secondary axis. Relevant
#    only for CoreXY type kinematics. Default value - max_step_size + 1.
#retry_tolerance: 0
#    Forced threshold to which the motor impulse magnitude must drop for the
#    synchronization procedure to complete successfully. Recommended to
#    configure in order to filter possible measurement errors. When using an
#    accelerometer, the typical range is [200..2000].
#retries: 0
#    Maximum number of retries to reach retry_tolerance.
#head_fan:
#    Full name of the toolhead fan that will be turned off during sync to
#    eliminate its noise. Can be specified multiple fans by separating
#    their names with commas.
#axis_prefix_<axis>:
#    Allows you to set a custom prefix that will be displayed before the
#    axis name in terminal outputs. You can use special characters or
#    Unicode icons to make the axes easier to distinguish.

[delayed_gcode restore_motors_sync]
initial_duration: 1.0
gcode:
  SYNC_MOTORS RESTORE_SYNC=1

  
# MOTOR 0 HR(B) #####################################################


[stepper_y]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200   #  Set to 200 for 1.8 degree stepper
#endstop_pin: PG9
endstop_pin: tmc2209_stepper_y:virtual_endstop # Sensorless homing
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 40               #  Max 100
second_homing_speed: 10
#homing_retract_dist: 5
homing_retract_dist: 0        # Sensorless homing
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC4
diag_pin: ^PG9
driver_SGTHRS: 255
interpolate: false
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_y]
#motor: ldo-42sth48-2504ah
#tuning_goal: performance


# MOTOR 1 HL(A) #####################################################


[stepper_x]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200   #  Set to 200 for 1.8 degree stepper
#endstop_pin: PG6
endstop_pin: tmc2209_stepper_x:virtual_endstop # Sensorless homing
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 40              #  Max 100
second_homing_speed: 10
#homing_retract_dist: 5
homing_retract_dist: 0        # Sensorless homing
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PD11
diag_pin: ^PG6
driver_SGTHRS: 255
interpolate: false
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_x]
#motor: ldo-42sth48-2504ah
#tuning_goal: performance


# MOTOR 2 VL ########################################################


[stepper_y1]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200	#  Set to 200 for 1.8 degree stepper

[tmc2209 stepper_y1]
uart_pin: PC6
driver_SGTHRS: 255				# Sensorless homing
interpolate: false
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_y1]
#motor: ldo-42sth48-2504ah
#tuning_goal: performance


# MOTOR 3 VR ########################################################


[stepper_x1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200	#  Set to 200 for 1.8 degree stepper

[tmc2209 stepper_x1]
uart_pin: PC7
driver_SGTHRS: 255				# Sensorless homing
interpolate: false
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_x1]
#motor: ldo-42sth48-2504ah
#tuning_goal: performance


#####################################################################
##   Z Stepper Settings   ###########################################
#####################################################################


# MOTOR 4 (VR) ######################################################


[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

position_max: 230
position_min: -15
homing_speed: 20
endstop_pin: probe:z_virtual_endstop   #  Configure z homing to use beacon as a virtual endstop
homing_retract_dist: 0                 #  Beacon does not require homing retract distance. Setting this to something other than 0 will cause occasional erroneous results.

[tmc2209 stepper_z]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_z]
#motor: ldo-42sth48-2504ac
#tuning_goal: performance


# MOTOR 5 (HR) ######################################################


[stepper_z1]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_z1]
#motor: ldo-42sth48-2504ac
#tuning_goal: performance


# MOTOR 6 (HL) ######################################################


[stepper_z2]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PE1
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_z2]
#motor: ldo-42sth48-2504ac
#tuning_goal: performance


# MOTOR 7 (VL) ######################################################


[stepper_z3]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PD3
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#[autotune_tmc stepper_z3]
#motor: ldo-42sth48-2504ac
#tuning_goal: performance


#####################################################################
##   Extruder   #####################################################
#####################################################################


[extruder]
step_pin: EBBCan: PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance: 22.79475
gear_ratio: 50:10
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan: PA3
min_temp: 10
max_temp: 315
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: 5.0

[tmc2209 extruder]
uart_pin: EBBCan: PA15
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: performance

[fan]
pin: EBBCan: PA0
kick_start_time: 0.1

[heater_fan hotend_fan]
pin: EBBCan: PA1
heater: extruder
heater_temp: 50.0
max_power: 1.0
fan_speed: 1.0
tachometer_pin: ^EBBCan: PB9





#####################################################################
##   Input Shaper   #################################################
#####################################################################


[input_shaper]
shaper_freq_x :77.2
shaper_freq_y: 51.4
shaper_type: mzv
damping_ratio_x: 0.049
damping_ratio_y: 0.049


