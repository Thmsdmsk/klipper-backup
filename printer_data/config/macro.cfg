
#####################################################################
##   Print_Start Macro   ############################################
#####################################################################


[gcode_macro PRINT_START]
gcode:
    # Wir holen das 'model' Feld aus dem beacon Status
    {% set beacon_model = printer.beacon.model %}

    ## Prüft ob ein gültiges Druckplatten-Profil geladen ist
    {% if beacon_model == "default" or beacon_model == None %}
        { action_raise_error("ABBRUCH: Keine Druckplatte gewählt! Aktuell: " ~ beacon_model) }
    {% else %}
        { action_respond_info("Check bestanden: Modell '" ~ beacon_model ~ "' ist aktiv.") }
    {% endif %}

##  This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  
##  Homes the printer, sets absolute positioning and updates the leds
    STATUS_HOMING   #  Sets SB-leds to homing-mode
    M107             #  Turns off part cooling fan
    G28              #  Full home (XYZ)
    G90              #  Absolut position

##  Uncomment for bed mesh (1 of 2)
    BED_MESH_CLEAR   #  Clears old saved bed mesh (if any)

##  Checks if the bed temp is higher than 90c - if so then trigger a heatsoak
    {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"   #  Displays info
    STATUS_HEATING                              #  Sets SB-leds to heating-mode

##  Uncomment if you have a Nevermore.
    SET_FAN_SPEED FAN=Nevermore SPEED=1                                             #  Turns on nevermore filter
    G1 X{x_wait} Y{y_wait} Z15 F9000                                                #  Goes to center of the bed
    M190 S{target_bed}                                                              #  Sets the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"                              #  Displays info
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={target_chamber}   #  Waits for chamber to reach desired temp

##  If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp with a 5min soak
    {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"   #  Displays info
    STATUS_HEATING                              #  Sets SB-leds to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000            #  Goes to center of the bed
    M190 S{target_bed}                          #  Sets the target temp for the bed
    #SET_DISPLAY_TEXT MSG="Soak for 5 min"      #  Displays info
    #G4 P300000                                 #  Waits 5 min for the bedtemp to stabilize
    {% endif %}

##  Heating nozzle to 150 degrees. This helps with getting a correct Z-home
    SET_DISPLAY_TEXT MSG="Hotend: 150c"   #  Displays info
    M109 S150                             #  Heats the nozzle to 150c

##  Uncomment for V2 (Quad gantry level AKA QGL)
    SET_DISPLAY_TEXT MSG="QGL"   #  Displays info
    STATUS_LEVELING              #  Sets SB-leds to leveling-mode
    QUAD_GANTRY_LEVEL            #  Levels the buildplate via QGL
    G28 Z                        #  Homes Z again after QGL

##  AWD stepper synchronisation
    SET_DISPLAY_TEXT MSG="Stepper synchronisation"
    {% if not printer.motors_sync.applied %}
    SYNC_MOTORS
	{% endif %}

##  Uncomment for bed mesh (2 of 2)
    SET_DISPLAY_TEXT MSG="Bed mesh"   #  Displays info
    STATUS_MESHING                    #  Sets SB-leds to bed mesh-mode
    BED_MESH_CALIBRATE ADAPTIVE=1     #  Starts bed mesh

##  Heats up the nozzle up to target via data from slicer
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"   #  Displays info
    STATUS_HEATING                                      #  Sets SB-leds to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000                    #  Goes to center of the bed
    M109 S{target_extruder}                             #  Heats the nozzle to printing temp
    G28 Z                                               #  Final Z homing
    SET_FAN_SPEED FAN=Exhaust SPEED=1                   #  Turns on exhaust fan
    
##  Gets ready to print by doing a purge line and updating the SB-leds
    SET_DISPLAY_TEXT MSG="Print"   #  Displays info
    STATUS_PRINTING                #  Sets SB-leds to printing-mode
    G0 X{x_wait - 50} Y4 F10000    #  Moves to starting point
    G0 Z0.4                        #  Raises Z to 0.4
    G91                            #  Incremental positioning 
    G1 X100 E20 F1000              #  Purge line
    G90                            #  Absolut position


#####################################################################
##   Print_End Macro   ##############################################
#####################################################################


[gcode_macro PRINT_END]
gcode:
##  Safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 50, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400             #  Wait for buffer to clear
    G92 E0           #  Zero the extruder
    G1 E-5.0 F1800   #  Retract filament
    
    TURN_OFF_HEATERS
    
    G90                                                         #  Absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                     #  Move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600   #  Park nozzle at rear
    M107                                                        #  Turn off fan
    BED_MESH_CLEAR                                              #  Uncomment for bed mesh (2 of 2)
    STATUS_HOMING                                              #  Sets XOL-leds to HOMING

##  Reset acceleration and velocity to config parameters
    {% set max_accel = printer.configfile.settings.printer.max_accel|float %}
    {% set max_velocity = printer.configfile.settings.printer.max_velocity|float %}
  
    SET_VELOCITY_LIMIT ACCEL={max_accel} VELOCITY={max_velocity}
    
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180
    UPDATE_DELAYED_GCODE ID=ex_filter_off DURATION=30
    #--------------------------------------------------------------------
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

##  Nevermore filter off command for PRINT_END macro
[delayed_gcode filter_off]
gcode:
    SET_FAN_SPEED FAN=Nevermore SPEED=0

##  Exhaust fan off command for PRINT_END macro
[delayed_gcode ex_filter_off]
gcode:
    SET_FAN_SPEED FAN=Exhaust SPEED=0


#####################################################################
##   Motors Sync   ##################################################
#####################################################################


[gcode_macro SYNC_MOTOR]
gcode:
    # Prüfen, ob das motors_sync Modul geladen ist und der Status False ist
    {% if printer.motors_sync is defined %}
        {% if not printer.motors_sync.applied %}
            {action_respond_info("Motoren-Synchronisierung wird ausgeführt...")}
            SYNC_MOTORS
        {% else %}
            {action_respond_info("Motoren sind bereits synchronisiert.")}
        {% endif %}
    {% else %}
        {action_respond_info("motors_sync Modul ist nicht in printer.cfg vorhanden.")}
    {% endif %}

[gcode_macro SYNC_MOTOR_STATS]
gcode:
    SYNC_MOTORS_STATS

[gcode_macro SYNC_MOTOR_STATS_CLEAR]
gcode:
    SYNC_MOTORS_STATS CLEAR=1

[gcode_macro SYNC_MOTOR_CALIBRATION]
gcode:
    SYNC_MOTORS_CALIBRATE AXIS=y DISTANCE=16 REPEATS=2 PLOT=1


#####################################################################
##   Hotend Fan Monitoring   ########################################
#####################################################################


# Author: alch3my#9819
# Requires a 3-wire fan with tachometer_pin defined. https://www.klipper3d.org/Config_Reference.html#heater_fan
# The tach wire can be connected to a spare endstop pin. 
# Don't forget a pullup (^) on the tach pin (example: tachometer_pin: ^P1.29)

# Monitoring loop. Begins at Klipper start.
[delayed_gcode CHECK_ALL_FANS]
initial_duration: 1
gcode:
    HOTEND_FAN_CHECK
    UPDATE_DELAYED_GCODE ID=CHECK_ALL_FANS DURATION=3

# Change min_rpm and max_consecutive_stops to your desired values.
[gcode_macro HOTEND_FAN_CHECK]
variable_he_stop_count: 0
gcode:
    {% set min_rpm = 3000|float %}
    {% set max_consecutive_stops = 3 %}
    {% set rpm = printer['heater_fan hotend_fan'].rpm|float %}
    {% set he_target = printer[printer.toolhead.extruder].target|float %}
    {% set he_temp = printer[printer.toolhead.extruder].temperature|float %}
    {% set fan_on_temp = printer.configfile.settings['heater_fan hotend_fan'].heater_temp|float %}
    {% set he_stop_count = printer["gcode_macro HOTEND_FAN_CHECK"].he_stop_count|int %}

    {% if (he_target >= fan_on_temp) and (rpm < min_rpm) and (he_temp >= fan_on_temp) %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE={he_stop_count + 1}
        M118 WARNING: Fan stoppage detected ({he_stop_count+1}/{max_consecutive_stops}).
        M400
        {% if printer["gcode_macro HOTEND_FAN_CHECK"].he_stop_count|int >= max_consecutive_stops-1 %}
            FAN_STOPPAGE_ROUTINE
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE=0
    {% endif %}

# Insert the gcode that you want to run when a fan stoppage is detected.
# This runs every ~3 seconds until the stop conditions are cleared.
[gcode_macro FAN_STOPPAGE_ROUTINE]
gcode:
    # If not already paused
    {% if printer['pause_resume'].is_paused|int == 0 %}
        M117 !!FAN STOPPAGE!!
        M118 FAN STOPPAGE DETECTED. PAUSING...
        PAUSE
        # Turn off the hotend. 
        # !! Don't forget to turn your hotend back on before resume. !!
        # -- If using this guide's pause/resume macros (in useful_macros.html), the hotend will automatically reheat on resume
        # -- (as long as the hotend is not turned off BEFORE pause is called)
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% endif %}


